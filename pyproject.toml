[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ceo"
description = "Critical Engineer Orchestrator: plans, not tickets, as the unit of coordination"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]
dynamic = ["version"]

[tool.setuptools.dynamic]
version = { attr = "ceo.__version__" }

[tool.setuptools.packages.find]
include = ["ceo*"]
