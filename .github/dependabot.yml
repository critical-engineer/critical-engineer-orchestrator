# Version updates wait 7 days after a release (supply-chain cooldown);
# security updates are not delayed. Every update is a PR that needs review.
version: 2
updates:
  - package-ecosystem: npm
    directory: /tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
